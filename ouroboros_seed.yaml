constraints:
- Phaser 3 framework must be used for all scene management and rendering pipelines.
- All graphics should use retro ASCII / terminal visual aesthetic styles.
- Game must execute perfectly inside standard modern browsers without native installs.
- 'No Placeholders: Core implementation contains no stub code, TODOs, comments containing
  placeholder phrases, or empty ellipses (...).'
architecture_decisions:
  AD-001:
    Title: Phaser 3 Game Engine Selection
    Status: Accepted
    Rationale: Phaser 3 provides robust rendering speed and high-level 2D abstraction
      ideal for WebGL/Canvas deployment.
  AD-002:
    Title: Stateless Simulator Isolation
    Status: Accepted
    Rationale: Separating state ticking from Phaser rendering cycles ensures that
      pure simulation code is easily unit-tested.
